name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: source
          persist-credentials: false

      - name: Checkout Foundation Lang
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: mirkobrombin/foundation-lang
          ref: 6f0592674b7041ff6bcbfbafeca8562096280b96
          path: toolchain
          persist-credentials: false

      - name: Install LLVM 21
        run: |
          wget -qO "$RUNNER_TEMP/llvm.sh" https://apt.llvm.org/llvm.sh
          chmod +x "$RUNNER_TEMP/llvm.sh"
          sudo "$RUNNER_TEMP/llvm.sh" 21
          sudo apt-get install --no-install-recommends -y llvm-21-dev

      - name: Build Foundation compiler
        run: |
          cmake -S toolchain -B toolchain/build -G Ninja \
            -DLLVM_DIR=/usr/lib/llvm-21/lib/cmake/llvm
          cmake --build toolchain/build --target foundationc --parallel 3

      - name: Verify source
        working-directory: source
        run: |
          ../toolchain/build/foundationc imports --check .
          ../toolchain/build/foundationc format --check .
          ../toolchain/build/foundationc check .
          ../toolchain/build/foundationc lint .
          ../toolchain/build/foundationc test .

      - name: Verify conversion
        working-directory: source
        run: |
          mkdir -p build "$RUNNER_TEMP/out"
          ../toolchain/build/foundationc build . -o build/transcript-converter
          build/transcript-converter examples/codex-rollout.jsonl \
            --output "$RUNNER_TEMP/out/session.jsonl"
          test "$(wc -l < "$RUNNER_TEMP/out/session.jsonl")" -eq 11
          grep '"subtype":"compact_boundary"' "$RUNNER_TEMP/out/session.jsonl" \
            | head -c 256 | grep -q '"compact_boundary"'
          cp "$RUNNER_TEMP/out/session.jsonl" "$RUNNER_TEMP/first.jsonl"
          rm "$RUNNER_TEMP/out/session.jsonl"
          build/transcript-converter examples/codex-rollout.jsonl \
            --output "$RUNNER_TEMP/out/session.jsonl"
          cmp "$RUNNER_TEMP/first.jsonl" "$RUNNER_TEMP/out/session.jsonl"
          if build/transcript-converter examples/codex-rollout.jsonl \
            --output "$RUNNER_TEMP/out/session.jsonl"; then
            echo "an existing transcript was replaced" >&2
            exit 1
          fi
